# Proxmox alerting. Separate from the Kubernetes rules (rules.yaml):
# own jsonnet entry point and own PrometheusRule label (proxmoxAlerting.labelPrometheus).
{{- if .Values.proxmoxAlerting.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ include "k8s-monitoring.namespace" . }}
  name: {{ include "k8s-monitoring.fullname" . }}-proxmox-rules-jsonnet
  labels:
{{ include "k8s-monitoring.labels" . | indent 4 }}
    app: {{ include "k8s-monitoring.name" . }}
    release: {{ include "k8s-monitoring.release" . }}
{{- with .Values.proxmoxAlerting.labelJsonnet }}
{{ toYaml . | indent 4 }}
{{- end }}
  annotations:
{{ include "k8s-monitoring.annotations" . | indent 4 }}
    jsonnet_filename: "rules-proxmox.jsonnet"
    tla_codes: |-
      { 'customConfig': '{{ .Values | mustToJson }}' }
{{- with .Values.proxmoxAlerting.labelPrometheus }}
    prometheus_label: {{ printf "%s=%s" (first (keys .)) (first (values .)) | quote }}
{{- end }}
binaryData:
  jsonnet-rules.tar.gz: {{ .Files.Get "jsonnet-rules.tar.gz" | b64enc }}
{{- end }}
